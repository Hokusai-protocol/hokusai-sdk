[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hokusai-openhands-example"
version = "0.1.0"
description = "Metadata-only OpenHands RouterLLM + SDK metrics integration for Hokusai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
openhands = [
  "openhands-sdk==1.36.1",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hokusai_openhands"]

[tool.setuptools.packages.find]
include = ["hokusai_openhands*"]
