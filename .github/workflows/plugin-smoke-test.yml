name: Plugin Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/plugin-smoke-test.yml'
      - 'packages/adapter-claude-code/plugin/**'
      - 'packages/adapter-claude-code/src/**'
      - 'packages/adapter-codex/plugin/**'
      - 'packages/adapter-codex/src/**'
      - 'packages/core/**'
      - 'scripts/build-plugin-zip.mjs'
      - 'scripts/build-codex-plugin-zip.mjs'
      - 'scripts/smoke-test-plugin.mjs'
      - 'scripts/smoke-test-codex-plugin.mjs'
      - 'examples/reference-harness/**'
  push:
    branches:
      - main
      - task/**
    paths:
      - '.github/workflows/plugin-smoke-test.yml'
      - 'packages/adapter-claude-code/plugin/**'
      - 'packages/adapter-claude-code/src/**'
      - 'packages/adapter-codex/plugin/**'
      - 'packages/adapter-codex/src/**'
      - 'packages/core/**'
      - 'scripts/build-plugin-zip.mjs'
      - 'scripts/build-codex-plugin-zip.mjs'
      - 'scripts/smoke-test-plugin.mjs'
      - 'scripts/smoke-test-codex-plugin.mjs'
      - 'examples/reference-harness/**'

jobs:
  plugin-smoke:
    name: Validate packaged plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Bundle plugin
        run: pnpm --filter @hokusai/adapter-claude-code bundle:plugin

      - name: Bundle Codex plugin
        run: pnpm --filter @hokusai/adapter-codex bundle:plugin

      - name: Package Claude plugin zip
        run: node scripts/build-plugin-zip.mjs

      - name: Package Codex plugin zip
        run: node scripts/build-codex-plugin-zip.mjs

      - name: Smoke test packaged Claude plugin
        run: node scripts/smoke-test-plugin.mjs

      - name: Smoke test packaged Codex plugin
        run: node scripts/smoke-test-codex-plugin.mjs

      - name: Check deterministic plugin zips
        run: |
          first_claude="$(shasum -a 256 dist-zip/hokusai-claude-code-plugin-latest.zip | awk '{print $1}')"
          first_codex="$(shasum -a 256 dist-zip/hokusai-codex-plugin-latest.zip | awk '{print $1}')"
          node scripts/build-plugin-zip.mjs
          node scripts/build-codex-plugin-zip.mjs
          second_claude="$(shasum -a 256 dist-zip/hokusai-claude-code-plugin-latest.zip | awk '{print $1}')"
          second_codex="$(shasum -a 256 dist-zip/hokusai-codex-plugin-latest.zip | awk '{print $1}')"
          test "$first_claude" = "$second_claude"
          test "$first_codex" = "$second_codex"

  smoke-live-api:
    name: Validate packaged plugin against live API
    needs: plugin-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Bundle plugin
        run: pnpm --filter @hokusai/adapter-claude-code bundle:plugin

      - name: Bundle Codex plugin
        run: pnpm --filter @hokusai/adapter-codex bundle:plugin

      - name: Package plugin zips
        run: node scripts/build-plugin-zip.mjs
      - run: node scripts/build-codex-plugin-zip.mjs

      - name: Route once against live API
        run: |
          if [ -z "$HOKUSAI_API_KEY" ]; then
            echo "HOKUSAI_SMOKE_API_KEY is not configured; skipping live API smoke."
            exit 0
          fi
          node scripts/smoke-test-plugin.mjs --live
        env:
          HOKUSAI_API_KEY: ${{ secrets.HOKUSAI_SMOKE_API_KEY }}
          HOKUSAI_ROUTING_CONSENT: 'true'
