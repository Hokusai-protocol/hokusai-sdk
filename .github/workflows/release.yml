name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish packages and plugin zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out shared data-pipeline schemas
        run: |
          git clone --depth 1 --branch tim/hok-2498-one-task-descriptor-schema-shared-by-the-sdk-and-the \
            https://github.com/Hokusai-protocol/hokusai-data-pipeline.git ../hokusai-data-pipeline \
          || git clone --depth 1 --branch main \
            https://github.com/Hokusai-protocol/hokusai-data-pipeline.git ../hokusai-data-pipeline
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check package boundaries
        run: pnpm check:boundaries

      - name: Build packages
        run: pnpm -r build

      - name: Test packages
        run: pnpm -r test

      - name: Bundle plugin
        run: pnpm --filter @hokusai/adapter-claude-code bundle:plugin

      - name: Bundle Codex plugin
        run: pnpm --filter @hokusai/adapter-codex bundle:plugin

      - name: Package Claude plugin zip
        run: node scripts/build-plugin-zip.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Package Codex plugin zip
        run: node scripts/build-codex-plugin-zip.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Assert zip is clean
        run: |
          if unzip -l dist-zip/hokusai-claude-code-plugin-*.zip \
            | grep -qE '\.env|node_modules|/features/|\.test\.|__fixtures__'; then
            echo "ERROR: zip contains forbidden paths" >&2
            exit 1
          fi
          echo "Zip content assertion passed"

      - name: Verify checksum
        run: |
          cd dist-zip
          sha256sum -c hokusai-claude-code-plugin-*.zip.sha256
          sha256sum -c hokusai-codex-plugin-*.zip.sha256

      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY is required to sign release plugin artifacts" >&2
            exit 1
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign plugin artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for artifact in dist-zip/*.zip dist-zip/*.zip.sha256; do
            gpg --batch --yes --armor --detach-sign \
              --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --output "${artifact}.asc" \
              "$artifact"
          done

      - name: Publish npm packages
        run: pnpm release --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_provenance: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-zip/hokusai-claude-code-plugin-*.zip
            dist-zip/hokusai-claude-code-plugin-*.zip.sha256
            dist-zip/hokusai-claude-code-plugin-*.zip.asc
            dist-zip/hokusai-claude-code-plugin-*.zip.sha256.asc
            dist-zip/hokusai-codex-plugin-*.zip
            dist-zip/hokusai-codex-plugin-*.zip.sha256
            dist-zip/hokusai-codex-plugin-*.zip.asc
            dist-zip/hokusai-codex-plugin-*.zip.sha256.asc
