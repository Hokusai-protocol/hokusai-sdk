name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-plugin:
    name: Build and publish Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Bundle plugin
        run: pnpm --filter @hokusai/adapter-claude-code bundle:plugin

      - name: Package plugin zip
        run: node scripts/build-plugin-zip.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Assert zip is clean
        run: |
          if unzip -l dist-zip/hokusai-claude-code-plugin-*.zip \
            | grep -qE '\.env|node_modules|/features/|\.test\.|__fixtures__'; then
            echo "ERROR: zip contains forbidden paths" >&2
            exit 1
          fi
          echo "Zip content assertion passed"

      - name: Verify checksum
        run: |
          cd dist-zip
          sha256sum -c hokusai-claude-code-plugin-*.zip.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-zip/hokusai-claude-code-plugin-*.zip
            dist-zip/hokusai-claude-code-plugin-*.zip.sha256
