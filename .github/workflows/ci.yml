name: CI

on:
  push:
    branches:
      - main
      - task/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out shared data-pipeline schemas
        run: |
          # HOK-2498 is merged, so take the schema from main. The feature branch it
          # used to clone still exists, which meant the `|| main` fallback never
          # fired and CI silently validated against a branch nobody maintains.
          git clone --depth 1 --branch main \
            https://github.com/Hokusai-protocol/hokusai-data-pipeline.git ../hokusai-data-pipeline
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm check:versions
      - run: pnpm check:docs
      - run: pnpm -r build
      - run: pnpm -r test

      # The release asserts the plugin manifest against the tag, so a stale
      # manifest aborts the release *after* everything above has passed. Build
      # the zips at a hypothetical next version here, where the failure is cheap.
      - name: Plugin zips build at a release tag
        run: |
          set -euo pipefail
          # The Codex zip is assembled from the esbuild bundle, not from dist/.
          pnpm --filter @hokusai/adapter-codex bundle:plugin
          GITHUB_REF_NAME="v$(node -p "require('./packages/adapter-claude-code/package.json').version")" \
            node scripts/build-plugin-zip.mjs
          GITHUB_REF_NAME="v$(node -p "require('./packages/adapter-codex/package.json').version")" \
            node scripts/build-codex-plugin-zip.mjs
