name: CI

on:
  push:
    branches:
      - main
      - task/**
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out shared data-pipeline schemas
        run: |
          git clone --depth 1 --branch tim/hok-2498-one-task-descriptor-schema-shared-by-the-sdk-and-the \
            https://github.com/Hokusai-protocol/hokusai-data-pipeline.git ../hokusai-data-pipeline \
          || git clone --depth 1 --branch main \
            https://github.com/Hokusai-protocol/hokusai-data-pipeline.git ../hokusai-data-pipeline
      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:boundaries
      - run: pnpm -r build
      - run: pnpm -r test
